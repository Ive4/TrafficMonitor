name: Rust desktop CI
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust target and checks
        run: |
          rustup component add clippy rustfmt
          rustup target add ${{ matrix.target }}
          cargo fetch --locked
      - name: Verify and package independent Rust desktop
        shell: pwsh
        run: ./scripts/verify-rust-desktop.ps1 -Architecture ${{ matrix.architecture }}
      - name: Verify trusted Rust plugin ABI fixture
        shell: pwsh
        run: ./rust/traffic-monitor-plugins/verify-fixtures.ps1 -Targets ${{ matrix.target }} -RustOnly
      - name: Upload application and resources
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Rust-${{ matrix.architecture }}
          path: Bin/Rust/${{ matrix.architecture }}/
          if-no-files-found: error

  arm64ec_check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check ARM64EC source compatibility
        run: |
          rustup target add arm64ec-pc-windows-msvc
          cargo fetch --locked
          cargo check --workspace --all-targets --target arm64ec-pc-windows-msvc --locked --offline -j 1
