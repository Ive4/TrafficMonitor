[workspace]
default-members = ["rust/traffic-monitor-native"]
members = [
    "rust/traffic-monitor-core",
    "rust/traffic-monitor-windows",
    "rust/traffic-monitor-history",
    "rust/traffic-monitor-shell",
    "rust/traffic-monitor-cli",
    "rust/traffic-monitor-config",
    "rust/traffic-monitor-desktop-ui",
    "rust/traffic-monitor-plugins",
    "rust/traffic-monitor-native",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"

[workspace.dependencies]
windows-sys = "=0.61.2"
quick-xml = "=0.38.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
