[package]
name = "traffic-monitor-desktop-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
traffic-monitor-shell = { path = "../traffic-monitor-shell" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com",
] }
